<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Message</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="video-container" id="videoContainer">
        <div class="start-prompt" id="startPrompt">
            <div class="prompt-text" data-lang="prompt">НАЖМИТЕ НА ЭКРАН ДЛЯ СТАРТА</div>
        </div>
        <video id="introVideo" preload="auto" playsinline></video>
    </div>

    <div class="loading-screen hidden" id="loadingScreen">
        <div class="loading-content">
            <div class="loading-text" data-lang="loading">ЗАГРУЗКА...</div>
            <div class="square-spinner"></div>
        </div>
    </div>

    <div class="black-overlay" id="blackOverlay"></div>

    <div class="main-menu hidden" id="mainMenu">
        <div class="tv-effects">
            <div class="scanlines"></div>
            <div class="flicker"></div>
        </div>
        
        <div class="menu-content" id="menuContent">
            <div class="logo-wrapper">
                <img src="logo.png" alt="The Message" class="menu-logo">
            </div>
            <div class="buttons-list" id="mainButtonsList">
                <button class="menu-btn" id="btnStart" data-lang="start">Начать игру</button>
                <button class="menu-btn" id="btnFree" data-lang="free">Свободная игра</button>
                <button class="menu-btn" id="btnSettings" data-lang="settings">Настройки</button>
            </div>
        </div>

        <div class="side-panel hidden" id="panelSettings">
            <h2 class="panel-title" data-lang="settings_title">Настройки</h2>
            
            <div class="setting-row">
                <span class="setting-label" data-lang="graphics">Графика:</span>
                <div class="setting-options">
                    <button class="select-btn active" data-lang="graphics_low">Низкая</button>
                    <button class="select-btn" data-lang="graphics_med">Средняя</button>
                    <button class="select-btn" data-lang="graphics_high">Высокая</button>
                </div>
            </div>

            <div class="setting-row">
                <span class="setting-label" data-lang="language">Язык:</span>
                <div class="setting-options">
                    <button class="select-btn active" id="langRu">Русский</button>
                    <button class="select-btn" id="langEn">English</button>
                </div>
            </div>

            <div class="setting-row">
                <button class="action-btn text-danger" id="btnClearData" data-lang="clear_data">Стереть все данные</button>
            </div>

            <button class="menu-btn back-btn" data-lang="back">Назад</button>
        </div>

        <div class="side-panel hidden" id="panelStart">
            <h2 class="panel-title" data-lang="chapters_title">Главы</h2>
            <div class="chapters-grid">
                <button class="menu-btn chapter-btn locked">
                    <span data-lang="ch1">Глава 1</span>
                    <span class="lock-icon">🔒</span>
                    <span class="coming-soon" data-lang="soon">скоро</span>
                </button>
                <button class="menu-btn chapter-btn locked">
                    <span data-lang="ch2">Глава 2</span>
                    <span class="lock-icon">🔒</span>
                    <span class="coming-soon" data-lang="soon">скоро</span>
                </button>
                <button class="menu-btn chapter-btn locked">
                    <span data-lang="ch3">Глава 3</span>
                    <span class="lock-icon">🔒</span>
                    <span class="coming-soon" data-lang="soon">скоро</span>
                </button>
                <button class="menu-btn chapter-btn locked">
                    <span data-lang="ch4">Глава 4</span>
                    <span class="lock-icon">🔒</span>
                    <span class="coming-soon" data-lang="soon">скоро</span>
                </button>
                <button class="menu-btn chapter-btn locked">
                    <span data-lang="ch5">Глава 5</span>
                    <span class="lock-icon">🔒</span>
                    <span class="coming-soon" data-lang="soon">скоро</span>
                </button>
            </div>
            <button class="menu-btn back-btn" data-lang="back">Назад</button>
        </div>
    </div>

    <div class="desktop-environment hidden" id="desktopEnv">
        <div class="tv-effects">
            <div class="scanlines"></div>
            <div class="flicker"></div>
        </div>
        
        <div class="desktop-main">
            <div class="desktop-window hidden" id="desktopSettingsWindow">
                <div class="window-header">
                    <span class="window-title" data-lang="settings_title">Настройки</span>
                    <button class="window-close-btn" id="btnCloseDesktopSettings">X</button>
                </div>
                <div class="window-content">
                    <div class="setting-row">
                        <span class="setting-label" data-lang="graphics">Графика:</span>
                        <div class="setting-options">
                            <button class="select-btn" data-gfx="low" data-lang="graphics_low">Низкая</button>
                            <button class="select-btn" data-gfx="medium" data-lang="graphics_med">Средняя</button>
                            <button class="select-btn" data-gfx="high" data-lang="graphics_high">Высокая</button>
                        </div>
                    </div>
                    <div class="setting-row">
                        <span class="setting-label" data-lang="language">Язык:</span>
                        <div class="setting-options">
                            <button class="select-btn" id="desktopLangRu">Русский</button>
                            <button class="select-btn" id="desktopLangEn">English</button>
                        </div>
                    </div>
                    <div class="setting-row">
                        <button class="action-btn text-danger" id="btnDesktopClearData" data-lang="clear_data">Стереть все данные</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="taskbar">
            <div class="taskbar-left"></div>
            <div class="taskbar-right">
                <button class="taskbar-btn" id="btnDesktopSettings" data-lang="settings">Настройки</button>
                <button class="taskbar-btn" id="btnDesktopExit" data-lang="exit">Выход</button>
                <div class="taskbar-clock" id="taskbarClock">00:00:00</div>
            </div>
        </div>
    </div>

    <script src="loading.js"></script>
    <script src="desktop.js"></script>
    <script src="script.js"></script>
</body>
</html>
